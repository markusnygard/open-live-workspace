services:
  couchdb:
    image: couchdb:3.5.2
    container_name: open-live-local-db
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-password}
    volumes:
      - couchdb-data:/opt/couchdb/data
    ports:
      - "0.0.0.0:5984:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD:-password}@localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10

  strom:
    image: ${STROM_IMAGE:-eyevinntechnology/strom-full:0.6.6}
    container_name: open-live-local-strom
    network_mode: ${STROM_NETWORK_MODE:-}
    privileged: true
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Stockholm}
      - STROM_API_KEY=${STROM_API_KEY}
      - STROM_ADMIN_USER=${STROM_ADMIN_USER:-admin}
      - STROM_ADMIN_PASSWORD_HASH=${STROM_ADMIN_PASSWORD_HASH}
      - STROM_SERVER_ICE_SERVERS=stun:127.0.0.1:3478
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GST_PLUGIN_FEATURE_RANK=nvcudadec:0,nvcuviddec:0,nvh264dec:0,nvvp8dec:0,nvvp9dec:0
      - CORS_ORIGIN=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_NICE
    volumes:
      - strom-data:/data
      - ${HOME:-/home/nygard}/media:/host/media:rw
      - /dev/blackmagic:/dev/blackmagic
      - /usr/lib/libDeckLinkAPI.so:/lib/libDeckLinkAPI.so:ro
      - /usr/lib/libDeckLinkPreviewAPI.so:/lib/libDeckLinkPreviewAPI.so:ro
      - /usr/lib/blackmagic:/lib/blackmagic:ro
    devices:
      - /dev/blackmagic:/dev/blackmagic
    ports:
      - "0.0.0.0:8080:8080"
      - "0.0.0.0:5000:5000/udp"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  stun-server:
    image: node:23-slim
    container_name: open-live-local-stun
    restart: unless-stopped
    network_mode: host
    command: >
      node -e "
      const dgram = require('dgram');
      const s = dgram.createSocket('udp4');
      s.on('message', (msg, rinfo) => {
        if (msg.length < 20) return;
        if (msg.readUInt16BE(0) !== 0x0001) return;
        const r = Buffer.alloc(32);
        r.writeUInt16BE(0x0101, 0);
        r.writeUInt16BE(12, 2);
        msg.copy(r, 4, 4, 20);
        r.writeUInt16BE(0x0020, 20);
        r.writeUInt16BE(8, 22);
        r.writeUInt8(0, 24); r.writeUInt8(0x01, 25);
        const p = rinfo.port ^ 0x2112;
        r.writeUInt16BE(p, 26);
        const ip = rinfo.address.split('.').map(Number);
        [0x21,0x12,0xA4,0x42].forEach((c,i) => r.writeUInt8(ip[i]^c, 28+i));
        s.send(r, rinfo.port, rinfo.address);
      });
      s.bind(3478, '0.0.0.0');
      "

  open-live:
    image: node:23-slim
    container_name: open-live-local-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../backend:/app
      - strom-data:/data
      - ${HOME:-/home/nygard}/media:/host/media:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8000
      - COUCHDB_URL=http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD:-password}@couchdb:5984
      - COUCHDB_NAME=open-live
      - CORS_ORIGIN=*
      - STROM_URL=http://${STROM_HOST:-strom}:8080
      - STROM_PUBLIC_URL=${STROM_PUBLIC_URL:-http://localhost:8080}
      - STROM_AUTH_MODE=direct
      - STROM_TOKEN=${STROM_API_KEY:-}
      - SDI_DEVICE_COUNT=${SDI_DEVICE_COUNT:-0}
      - LOG_LEVEL=info
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@latest --activate &&
      pnpm install &&
      sleep 5 &&
      pnpm exec tsx src/main.ts --host"
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      couchdb:
        condition: service_healthy
      strom:
        condition: service_healthy

  open-live-studio:
    image: node:23-slim
    container_name: open-live-local-studio
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../frontend:/app
    environment:
      - OPEN_LIVE_URL=http://${IP:-localhost}:8000
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@latest --activate &&
      pnpm install &&
      pnpm exec vite --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "0.0.0.0:3000:5173"
    depends_on:
      - open-live

volumes:
  couchdb-data:
  strom-data:
